plugins {
    id 'com.android.application'
}
android {
    namespace 'com.erfansst3.visiontap'
    compileSdk 35
    defaultConfig {
        applicationId 'com.erfansst3.visiontap'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.opencv:opencv:4.12.0'
}
